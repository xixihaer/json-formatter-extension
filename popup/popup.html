<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>JSON 格式化</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="toolbar">
    <span class="brand">{&nbsp;}&nbsp;JSON</span>
    <span class="actions">
      <button id="btn-format" title="格式化 (Ctrl+Enter)">格式化</button>
      <button id="btn-minify" title="压缩 (Ctrl+Shift+Enter)">压缩</button>
      <button id="btn-copy" title="复制结果">复制</button>
      <button id="btn-clear" title="清空">清空</button>
      <select id="sel-indent" title="缩进">
        <option value="2">2 空格</option>
        <option value="4">4 空格</option>
        <option value="tab">Tab</option>
      </select>
      <select id="sel-escape" title="转义处理：对从日志等处拷来的字符串化 JSON（外层引号+内部转义）是否自动解包">
        <option value="auto">自动转义</option>
        <option value="keep">保留转义</option>
      </select>
    </span>
  </header>

  <main class="stage">
    <textarea id="input" spellcheck="false" wrap="off"
      placeholder="粘贴 JSON，点击「格式化」或按 Ctrl+Enter"></textarea>
    <pre id="output" hidden title="可直接编辑 · Esc 回编辑器 · Ctrl+Enter 重新格式化"><code id="output-code" contenteditable="true" spellcheck="false"></code></pre>
  </main>

  <footer id="status" class="status">就绪</footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
